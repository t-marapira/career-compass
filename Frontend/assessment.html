<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Career Compass | Assessment</title>

    <link rel="stylesheet" href="css/assessment.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="dashboard">

        <!-- SIDEBAR -->

        <aside>

            <h2>Career Compass</h2>

            <nav>

                <a href="dashboard.html">Dashboard</a>

                <a href="assessment.html" class="active">Assessment</a>

                <a href="results.html">Results</a>

                <a href="profile.html">Profile</a>

                <a href="index.html">Logout</a>

            </nav>

        </aside>

        <!-- MAIN CONTENT -->

        <main>

            <section class="page-title">

                <h1>Career Assessment</h1>

                <p>
                    Select your target career and completed university modules.
                </p>

            </section>

            <section class="assessment-form">

                <form>

                    <div class="form-group">

                        <label>Target Career</label>

                        <select>

                            <option>Select a Career</option>
                            <option>Backend Developer</option>
                            <option>Frontend Developer</option>
                            <option>Full Stack Developer</option>
                            <option>Software Engineer</option>
                            <option>Data Analyst</option>
                            <option>Data Scientist</option>
                            <option>AI / Machine Learning Engineer</option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label>Completed Modules</label>

                        <div class="module-list">

							<label><input type="checkbox"> Mathematics</label>
							<label><input type="checkbox"> Statistics</label>
							<label><input type="checkbox"> Informatics</label>
							<label><input type="checkbox"> Computer Science</label>
							<label><input type="checkbox"> Programming 1</label>
							<label><input type="checkbox"> Programming 2</label>
							<label><input type="checkbox"> Database Systems</label>
							<label><input type="checkbox"> Web Development</label>
							<label><input type="checkbox"> Software Engineering</label>
							<label><input type="checkbox"> Data Structures and Algorithms</label>
							<label><input type="checkbox"> Computer Networks</label>
							<label><input type="checkbox"> Operating Systems</label>

                        </div>

                    </div>

                    <button type="submit">

                        Generate Results

                    </button>

                </form>

            </section>

        </main>

    </div>
	<script src="js/assessment.js"></script>
</body>

</html>
