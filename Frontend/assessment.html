<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Career Compass | Assessment</title>

    <link rel="stylesheet" href="css/assessment.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="dashboard">
      <!-- SIDEBAR -->

      <aside>
        <h2>Career Compass</h2>

        <nav>
          <a href="dashboard.html">Dashboard</a>

          <a href="assessment.html" class="active">Assessment</a>

          <a href="results.html">Results</a>

          <a href="profile.html">Profile</a>

          <a href="index.html">Logout</a>
        </nav>
      </aside>

      <!-- MAIN CONTENT -->

      <main>
        <section class="page-title">
          <h1>Career Assessment</h1>

          <p>Select your target career and completed university modules.</p>
        </section>

        <section class="assessment-form">
          <form>
            <div class="form-group">
              <label>Target Career</label>

              <select id="career-list">
                <option>Select a Career</option>
              </select>
            </div>

            <div class="form-group">
              <label>Completed Modules</label>

              <div class="module-list" id="module-list" />
            </div>

            <button type="submit">Generate Results</button>
          </form>
        </section>
      </main>
    </div>
    <script src="js/assessment.js"></script>
  </body>
</html>
